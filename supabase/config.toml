project_id = "codecard"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "exp://localhost:8081/**"]
# Access token lifetime: 1 hour. Client auto-refreshes so users stay signed in.
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Staging/MVP: keep email confirmations on for signup → /auth/confirmed flow.
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"
